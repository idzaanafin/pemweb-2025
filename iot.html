<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Farming Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f7f9fb;
    }
    .card {
      border: none;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      padding: 25px 20px;
      text-align: left;
      min-height: 120px;
      height: 100%;
    }
    .title {
      font-size: 0.7rem;
      font-weight: 600;
      color: #555;
    }
    .value {
      font-size: 1.3rem;
      font-weight: bold;
      margin-top: 8px;
    }
    .unit {
      font-size: 1.3rem;
      color: rgb(70, 66, 66);
    }
    .header {
      font-weight: 700;
      margin: 20px 0;
      text-align: left;
    }
    .card-blue { border-left: 5px solid #007bff; }
    .card-green { border-left: 5px solid #28a745; }
    .card-cyan { border-left: 5px solid #17a2b8; }
    .card-yellow { border-left: 5px solid #ffc107; }
    .card-red { border-left: 5px solid #dc3545; }
    .progress {
      height: 8px;
      margin-top: 8px;
      background-color: #e9ecef;
      border-radius: 10px;
      overflow: hidden;
    }
    .progress-bar {
      border-radius: 10px;
      transition: width 0.6s ease-in-out;
    }
  </style>
</head>
<body>

  <div class="container py-4">
    <h3 class="header">Smart Farming</h3>

    <!-- Baris 1 -->
    <div class="row g-3">
      <div class="col-12 col-sm-6 col-md-4 col-lg-2 flex-fill">
        <div class="card card-blue">
          <div class="title">KELEMBABAN (RH)</div>
          <div class="value text-primary">54 <span class="unit">%</span></div>
        </div>
      </div>

      <div class="col-12 col-sm-6 col-md-4 col-lg-2 flex-fill">
        <div class="card card-green">
          <div class="title">TDS</div>
          <div class="value">400 <span class="unit">ppm</span></div>
        </div>
      </div>

      <div class="col-12 col-sm-6 col-md-4 col-lg-2 flex-fill">
        <div class="card card-cyan">
          <div class="title">KEKERUHAN (TURBID)</div>
          <div class="value">18 <span class="unit">NTU</span></div>
          <div class="progress mt-2">
            <div class="progress-bar bg-info" role="progressbar" style="width:60%"></div>
          </div>
        </div>
      </div>

      <div class="col-12 col-sm-6 col-md-4 col-lg-2 flex-fill">
        <div class="card card-yellow">
          <div class="title">TEMPERATUR AIR (WTEMP)</div>
          <div class="value">25 <span class="unit">°C</span></div>
        </div>
      </div>

      <div class="col-12 col-sm-6 col-md-4 col-lg-2 flex-fill">
        <div class="card card-red">
          <div class="title">ALIRAN AIR (WFLOW)</div>
          <div class="value">34</div>
        </div>
      </div>
    </div>

    <!-- Baris 2 -->
    <div class="row g-3 mt-1">
      <div class="col-12 col-sm-6 col-md-4 col-lg-2 flex-fill">
        <div class="card card-blue">
          <div class="title">OKSIGEN TERLARUT (DISS.OXYGEN)</div>
          <div class="value">10 <span class="unit">ppm</span></div>
        </div>
      </div>

      <div class="col-12 col-sm-6 col-md-4 col-lg-2 flex-fill">
        <div class="card card-green">
          <div class="title">INTENSITAS CAHAYA (LUX)</div>
          <div class="value">100 <span class="unit">Lux</span></div>
        </div>
      </div>

      <div class="col-12 col-sm-6 col-md-4 col-lg-2 flex-fill">
        <div class="card card-cyan">
          <div class="title">TEMPERATUR UDARA (AMTEMP)</div>
          <div class="value">34 <span class="unit">°C</span></div>
          <div class="progress mt-2">
            <div class="progress-bar bg-primary" style="width:80%"></div>
          </div>
        </div>
      </div>

      <div class="col-12 col-sm-6 col-md-4 col-lg-2 flex-fill">
        <div class="card card-yellow">
          <div class="title">EC</div>
          <div class="value">2</div>
        </div>
      </div>

      <div class="col-12 col-sm-6 col-md-4 col-lg-2 flex-fill">
        <div class="card card-red">
          <div class="title">pH</div>
          <div class="value">7.1</div>
        </div>
      </div>
    </div>

  </div>
</body>
</html>
