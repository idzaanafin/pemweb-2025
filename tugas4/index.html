<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Formulir Pendaftaran Seminar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <header class="bg-black text-white text-center py-4">    
    <p class="lead mb-0">Isi data Anda untuk mengikuti seminar</p>
  </header>
  
  <main class="container my-5">
    <section class="row justify-content-center">
      <article class="col-md-8">
        <div class="card shadow-sm border-0">
          <div class="card-body">
            <h2 class="h4 mb-4">Formulir Pendaftaran</h2>
            
            <form>              
              <div class="mb-3">
                <label for="nama" class="form-label">Nama Lengkap</label>
                <input type="text" id="nama" name="nama" class="form-control" placeholder="Masukkan nama lengkap Anda" required>
              </div>
              
              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="Masukkan email (contoh@email.com)" required>
              </div>
              
              <div class="mb-3">
                <label for="telepon" class="form-label">Nomor Telepon</label>
                <input type="tel" id="telepon" name="telepon" class="form-control" placeholder="Masukan Nomor telepon (08xxxxxxxxxx)" required>
              </div>
              
              <div class="mb-3">
                <label for="sesi" class="form-label">Pilih Sesi Seminar</label>
                <select id="sesi" name="sesi" class="form-select" required>
                  <option value="">-- Pilih Sesi --</option>
                  <option value="sesi1">Sesi 1: Web Development</option>
                  <option value="sesi2">Sesi 2: Cyber Security</option>
                  <option value="sesi3">Sesi 3: Data Science</option>
                  <option value="sesi4">Sesi 4: Artificial Intelligence</option>
                </select>
              </div>
              
              <div class="mb-3">
                <label for="komentar" class="form-label">Komentar atau Pertanyaan</label>
                <textarea id="komentar" name="komentar" rows="4" class="form-control" placeholder="Tulis komentar atau pertanyaan Anda di sini..."></textarea>
              </div>
              
              <div class="text-end">
                <button type="submit" class="btn btn-primary px-4">Daftar</button>
              </div>
            </form>
            
          </div>
        </div>
      </article>
    </section>
  </main>

  <footer class="bg-dark text-white text-center py-3">
    <p class="mb-0">&copy; 2025.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
